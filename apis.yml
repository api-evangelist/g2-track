aid: g2-track
name: G2 Track
description: >-
  G2 Track was G2's SaaS spend management product — a single view of purchased applications, users,
  contracts and license utilization, used by IT and finance teams to find shadow IT, reclaim unused
  licenses and benchmark contracts ahead of renewal. BetterCloud acquired the G2 Track product line
  from G2 on 2024-03-12 and sells it today as the BetterCloud Spend Optimization module of the
  BetterCloud SaaS management platform, alongside User Automation, Workspace Management for Google
  and File Governance. The standalone product is gone: g2track.com is now a parked ad-redirect page,
  and the surviving surfaces — pricing, status, documentation, support and the platform API — are
  BetterCloud's. There is no G2 Track-specific API; the module is reached through the BetterCloud
  platform API at api.bettercloud.com, which BetterCloud documents on developer.bettercloud.com.
