specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: G2 Track
providerId: g2-track
generated: '2026-09-12'
method: probed
source: >-
  https://developer.bettercloud.com/ (no published limits) + live response headers from
  https://api.bettercloud.com/api/v1/tokens/lookup
created: '2026-05-04'
modified: '2026-09-12'
tags:
- SaaS Management
- Spend Optimization
- Rate Limiting
description: >-
  An honest zero. No rate limits are published for the API behind this record. G2 Track is operated
  by BetterCloud (acquired 2024-03-12, sold as Spend Optimization); its developer portal publishes
  no limits page, its OpenAPI declares no limit-related responses or headers, and an unauthenticated
  request to the production host returns no RateLimit-* or X-RateLimit-* headers. REPLACES a
  2026-05-04 bulk-sweep scaffold that published five invented tiers (10/100/1000 rpm, 1k/100k
  monthly quotas) and a full set of X-RateLimit-* headers the API does not send - none of that was
  ever provider-published, so it has been removed rather than carried forward.
limit_count: 0
documented: false
headers_observed: []
headers_documented: []
probe:
  url: https://api.bettercloud.com/api/v1/tokens/lookup
  method: GET
  status: 401
  date: '2026-09-12'
  response_headers:
  - date
  - content-type
  - www-authenticate
  - content-length
  - access-control-allow-origin
  - via
  - alt-svc
  note: >-
    401 with www-authenticate: Key realm="kong" - the API sits behind a Kong gateway, which is
    where limits would normally be enforced and signalled, but no rate-limit header is emitted on an
    unauthenticated response. Authenticated behaviour was not tested; we hold no credentials.
responseCodes:
  throttled: not documented
  quotaExceeded: not documented
gap: >-
  For the provider: publishing the per-token limit and emitting RateLimit-Limit / RateLimit-Remaining
  / RateLimit-Reset (or Retry-After on 429) would let an agent pace itself instead of discovering
  the ceiling by tripping it.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
