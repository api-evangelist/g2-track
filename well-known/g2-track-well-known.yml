description: >-
  Probe of the named /.well-known/ path list across every host on the G2 Track record. G2 Track was
  acquired by BetterCloud on 2024-03-12 and is sold today as BetterCloud Spend Optimization, so the
  hosts probed are the operator's (bettercloud.com family) plus the product's own legacy domain
  (g2track.com). Two real documents were returned, both by the operator's marketing host: an RFC 8414
  OAuth authorization-server metadata document and an RFC 9728 protected-resource metadata document,
  which together advertise an OAuth-protected MCP endpoint. Every other 200 in this file is an HTML
  SPA or parked-domain catch-all, not a document, and is recorded as such.
