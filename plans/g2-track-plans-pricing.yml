description: >-
  Published plans for the product this record tracks. G2 Track was acquired by BetterCloud on
  2024-03-12 and is sold as the BetterCloud Spend Optimization module; BetterCloud prices by module
  rather than by API tier, and there is NO published API pricing, no per-request price, and no
  request-quota tier of any kind. Read verbatim from the operator's pricing page on 2026-09-12.
  REPLACES a 2026-05-04 bulk-sweep scaffold that asserted invented Free/Professional/Enterprise
  tiers with invented request quotas and rate limits; none of those numbers were ever published by
  the provider and they have been removed rather than carried forward.
